version: '3.8'
services:
  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_DATABASE=DB_CONFIG
      - DB_USERNAME=root
      - DB_PASSWORD=root
    ports:
      - "23017:23017" 
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    command: ["--port", "23017"]

  app:
    build: .
    image: varn03/iiitb360:latest  # <-- Replace with your Docker Hub username and desired repository name
    ports:
      - "8081:8081"
    environment:
      - DB_SERVER=mongo
      - DB_PORT=23017
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongo:23017/DB_CONFIG?authSource=DB_CONFIG
      - SERVER_PORT=8081

volumes:
  mongo_data:

